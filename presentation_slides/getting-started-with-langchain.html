</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="dark quote" data-theme="automata" lang="en-US" class="dark quote" data-marpit-pagination="7" style="--paginate:true;--class:dark quote;--theme:automata;" data-marpit-pagination-total="55">
<blockquote>
<p><span class="mark">&quot;</span>An agent is a model calling tools in a loop until a given task is complete.<span class="mark">&quot;</span></p>
</blockquote>
<div class="by">— <a href="https://docs.langchain.com/oss/python/langchain/agents">the official LangChain docs</a> · "Agent = Model + Harness"</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="1" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="the-core-components-of-an-agent">The core components of an agent</h2>
<div class="bento">
<div class="cell"><h3>LLM</h3><p>The reasoning engine — decides what to say, or which tool to call.</p></div>
<div class="cell"><h3>Tools</h3><p>Plain Python functions. The LLM asks; <em>your code</em> executes.</p></div>
<div class="cell"><h3>Loop</h3><p>Call model → run requested tools → feed results back → repeat.</p></div>
</div>
<ul>
<li data-marpit-fragment="1">Every agent framework is a packaging of these three pieces</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="the-agent-loop">The agent loop</h2>
<p><img src="assets/agent_loop.svg" alt="" style="width:850px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="10" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Step 1 — just an LLM call</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> langchain.chat_models <span class="hljs-keyword">import</span> init_chat_model
<span class="hljs-keyword">from</span> langchain.messages <span class="hljs-keyword">import</span> HumanMessage, SystemMessage

model = init_chat_model(<span class="hljs-string">&quot;openai:gpt-5.6-terra&quot;</span>, reasoning_effort=<span class="hljs-string">&quot;none&quot;</span>)

response = model.invoke([
    SystemMessage(content=<span class="hljs-string">&quot;You tell jokes.&quot;</span>),
    HumanMessage(content=<span class="hljs-string">&quot;Tell me a joke about a bald teacher.&quot;</span>),
])
<span class="hljs-built_in">print</span>(response.content)   <span class="hljs-comment"># an AIMessage — text in, text out</span>
</code></pre>
<p>No tools, no loop — the model can only <em>talk</em>. Let's give it hands.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="11" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Step 2 — tools with @tool</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> langchain_core.tools <span class="hljs-keyword">import</span> tool

<span class="hljs-meta">@tool</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">create_folder</span>(<span class="hljs-params">folder_name: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:
    <span class="hljs-string">&quot;&quot;&quot;Create a folder (directory) inside the sandbox workspace.&quot;&quot;&quot;</span>
    path = os.path.join(SANDBOX_DIR, folder_name)
    os.makedirs(path, exist_ok=<span class="hljs-literal">True</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;Folder created at: <span class="hljs-subst">{path}</span>&quot;</span>

tools = [create_folder, create_file, read_file, calculator]
tools_by_name = {t.name: t <span class="hljs-keyword">for</span> t <span class="hljs-keyword">in</span> tools}
</code></pre>
<p>Type hints + docstring <strong>are</strong> the schema the model sees.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="12" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Step 3 — the model asks, your code executes</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model_with_tools = model.bind_tools(tools)

ai_message = model_with_tools.invoke(messages)
ai_message.tool_calls
<span class="hljs-comment"># [{&quot;name&quot;: &quot;create_folder&quot;, &quot;args&quot;: {&quot;folder_name&quot;: &quot;notes&quot;}, &quot;id&quot;: &quot;...&quot;}]</span>

<span class="hljs-keyword">from</span> langchain.messages <span class="hljs-keyword">import</span> ToolMessage
messages.append(ai_message)
<span class="hljs-keyword">for</span> call <span class="hljs-keyword">in</span> ai_message.tool_calls:
    result = tools_by_name[call[<span class="hljs-string">&quot;name&quot;</span>]].invoke(call[<span class="hljs-string">&quot;args&quot;</span>])
    messages.append(ToolMessage(content=<span class="hljs-built_in">str</span>(result), tool_call_id=call[<span class="hljs-string">&quot;id&quot;</span>]))
</code></pre>
<p>The model only <em>requested</em> the call — nothing ran until our loop ran it.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="13" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Step 4 — the whole agent, by hand</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">run_agent_loop</span>(<span class="hljs-params">user_task: <span class="hljs-built_in">str</span>, max_iters: <span class="hljs-built_in">int</span> = <span class="hljs-number">5</span></span>):
    messages = [SystemMessage(...), HumanMessage(content=user_task)]
    <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(max_iters):
        ai_message = model_with_tools.invoke(messages)
        messages.append(ai_message)
        <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> ai_message.tool_calls:          <span class="hljs-comment"># done — no more tool requests</span>
            <span class="hljs-keyword">return</span> ai_message.content
        <span class="hljs-keyword">for</span> call <span class="hljs-keyword">in</span> ai_message.tool_calls:     <span class="hljs-comment"># execute each requested tool</span>
            result = tools_by_name[call[<span class="hljs-string">&quot;name&quot;</span>]].invoke(call[<span class="hljs-string">&quot;args&quot;</span>])
            messages.append(ToolMessage(content=<span class="hljs-built_in">str</span>(result),
                                        tool_call_id=call[<span class="hljs-string">&quot;id&quot;</span>]))
    <span class="hljs-keyword">return</span> messages[-<span class="hljs-number">1</span>].content
</code></pre>
<p>~15 lines. This <strong>is</strong> an agent.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="14" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Step 5 — the same agent with create_agent()</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> langchain.agents <span class="hljs-keyword">import</span> create_agent

agent = create_agent(
    model=model,          <span class="hljs-comment"># binds the tools for you</span>
    tools=tools,
    system_prompt=<span class="hljs-string">&quot;You are a desktop file-system assistant.&quot;</span>,
)

result = agent.invoke({<span class="hljs-string">&quot;messages&quot;</span>: <span class="hljs-string">&quot;Create a folder called &#x27;trip-notes&#x27; ...&quot;</span>})
result[<span class="hljs-string">&quot;messages&quot;</span>][-<span class="hljs-number">1</span>].pretty_print()
</code></pre>
<p>Same behavior, three lines — now you know exactly what it's hiding.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="what-create_agent-replaced">What <code>create_agent()</code> replaced</h2>
<table>
<thead>
<tr>
<th>From-scratch piece</th>
<th><code>create_agent()</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>model.bind_tools(tools)</code></td>
<td>internal, via <code>tools=[...]</code></td>
</tr>
<tr>
<td>Building <code>System</code>/<code>Human</code> messages</td>
<td><code>system_prompt=</code> + <code>{&quot;messages&quot;: ...}</code></td>
</tr>
<tr>
<td>Reading <code>tool_calls</code>, dispatching</td>
<td>internal</td>
</tr>
<tr>
<td>Building <code>ToolMessage(...)</code></td>
<td>internal</td>
</tr>
<tr>
<td>The loop + safety cap</td>
<td>built into the compiled graph</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="lead" data-theme="automata" lang="en-US" class="lead" data-marpit-pagination="16" style="--paginate:true;--class:lead;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Notebook demo</div>
<h1 id="00-langchain-basics-introipynb"><code>00-langchain-basics-intro.ipynb</code></h1>
<p>Agents from scratch → <code>create_agent()</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="qa--part-0-recap">Q&amp;A · Part 0 recap</h2>
<ul>
<li data-marpit-fragment="1">An <strong>agent = LLM + tools + loop</strong> — the LLM requests, your code executes, results feed back</li>
<li data-marpit-fragment="2"><code>bind_tools()</code> makes the model emit <code>tool_calls</code>; <code>ToolMessage</code> carries results back</li>
<li data-marpit-fragment="3"><code>create_agent()</code> <strong>packages that exact loop</strong> — an abstraction you've now built yourself</li>
</ul>
<div class="cell" style="margin-top:20px"><h3>Optional exercise</h3><p>Add a <code>delete_file</code> tool to the from-scratch loop and have the agent clean up its own sandbox.</p></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="poll">Poll</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Which best describes what create_agent() returns in LangChain 1.0?

  A. A REST API endpoint for the model
  B. A compiled LangGraph graph you invoke with {&quot;messages&quot;: [...]}
  C. A fixed script that cannot be modified once generated
  D. A raw string containing the model&#x27;s response
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" style="--class:lead dark;--theme:automata;"><div class="kicker">Part 1 · notebook 1.0</div>
<h1 id="langchain-emfundamentalsem">LangChain <em>fundamentals</em></h1>
<p>Six building blocks you'll use in every app.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="the-six-building-blocks">The six building blocks</h2>
<div class="bento">
<div class="cell"><h3>Agents</h3><p><code>create_agent()</code> — the central API</p></div>
<div class="cell"><h3>Models</h3><p><code>init_chat_model()</code></p></div>
<div class="cell"><h3>Messages</h3><p>system · human · ai · tool</p></div>
<div class="cell"><h3>Tools</h3><p><code>@tool</code> decorator</p></div>
<div class="cell"><h3>Memory</h3><p>checkpointer + thread</p></div>
<div class="cell"><h3>Streaming</h3><p>values · messages · custom</p></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="1" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="models--one-factory-any-provider">Models — one factory, any provider</h2>
<table>
<thead>
<tr>
<th>Provider</th>
<th>Model string</th>
<th>Package</th>
</tr>
</thead>
<tbody>
<tr>
<td>OpenAI</td>
<td><code>openai:gpt-5.6-terra</code></td>
<td><code>langchain-openai</code></td>
</tr>
<tr>
<td>Anthropic</td>
<td><code>anthropic:claude-sonnet-4-6</code></td>
<td><code>langchain-anthropic</code></td>
</tr>
<tr>
<td>Google</td>
<td><code>google_genai:gemini-3.1-flash</code></td>
<td><code>langchain-google-genai</code></td>
</tr>
<tr>
<td>Local (Ollama)</td>
<td><code>ollama:gemma3</code></td>
<td><code>langchain-ollama</code></td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1">Three call styles: <strong><code>invoke()</code></strong> one response · <strong><code>stream()</code></strong> token by token · <strong><code>batch()</code></strong> parallel</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="22" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Messages — typed conversation turns</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> langchain_core.messages <span class="hljs-keyword">import</span> SystemMessage, HumanMessage

messages = [
    SystemMessage(<span class="hljs-string">&quot;You are a pirate that answers briefly.&quot;</span>),
    HumanMessage(<span class="hljs-string">&quot;What is machine learning?&quot;</span>),
]
response = model.invoke(messages)      <span class="hljs-comment"># -&gt; AIMessage</span>

response.usage_metadata               <span class="hljs-comment"># token accounting</span>
response.content_blocks               <span class="hljs-comment"># v1: unified content across providers</span>
</code></pre>
<p>Dict form works too: <code>{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;...&quot;}</code> — fully interchangeable.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="tools--two-hard-rules">Tools — two hard rules</h2>
<ul>
<li data-marpit-fragment="1"><strong>Type hints are mandatory</strong> — they define the argument schema</li>
<li data-marpit-fragment="2"><strong>Docstrings are mandatory</strong> — they tell the model <em>when</em> to call it</li>
<li data-marpit-fragment="3">Complex inputs? Attach a Pydantic model: <code>@tool(args_schema=WeatherQuery)</code></li>
<li data-marpit-fragment="4">Runtime context without hardcoding: <code>context_schema=</code> + <code>ToolRuntime</code> (dependency injection)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="24" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Short-term memory — checkpointer + thread_id</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> langgraph.checkpoint.memory <span class="hljs-keyword">import</span> InMemorySaver

agent = create_agent(
    model=model, tools=[search],
    checkpointer=InMemorySaver(),
)

config = {<span class="hljs-string">&quot;configurable&quot;</span>: {<span class="hljs-string">&quot;thread_id&quot;</span>: <span class="hljs-string">&quot;session-1&quot;</span>}}
agent.invoke({<span class="hljs-string">&quot;messages&quot;</span>: <span class="hljs-string">&quot;Hi! My name is Lucas.&quot;</span>}, config)
agent.invoke({<span class="hljs-string">&quot;messages&quot;</span>: <span class="hljs-string">&quot;What&#x27;s my name?&quot;</span>}, config)   <span class="hljs-comment"># remembers</span>
<span class="hljs-comment"># thread_id &quot;session-2&quot; -&gt; a fresh conversation, no Lucas</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="streaming--three-modes">Streaming — three modes</h2>
<table>
<thead>
<tr>
<th>Mode</th>
<th>You get</th>
<th>Use for</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>&quot;values&quot;</code></td>
<td>full state after each step</td>
<td>inspecting agent steps</td>
</tr>
<tr>
<td><code>&quot;messages&quot;</code></td>
<td><code>(token, metadata)</code> tuples</td>
<td>chat UX, token by token</td>
</tr>
<tr>
<td><code>&quot;custom&quot;</code></td>
<td>your own events via <code>get_stream_writer()</code></td>
<td>tool progress updates</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="dark quote" data-theme="automata" lang="en-US" class="dark quote" data-marpit-pagination="26" style="--paginate:true;--class:dark quote;--theme:automata;" data-marpit-pagination-total="55">
<blockquote>
<p><span class="mark">&quot;</span>Reasoning models need <code>reasoning_effort=&quot;none&quot;</code> to call function tools.<span class="mark">&quot;</span></p>
</blockquote>
<div class="by">— the course gotcha: whenever an agent has tools, build the model with<br /><code>init_chat_model("openai:gpt-5.6-terra", reasoning_effort="none")</code></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="lead" data-theme="automata" lang="en-US" class="lead" data-marpit-pagination="27" style="--paginate:true;--class:lead;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Notebook demo</div>
<h1 id="10-langchain-fundamentalsipynb"><code>1.0-langchain-fundamentals.ipynb</code></h1>
<p>Models · messages · tools · memory · streaming</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="qa--part-1-recap">Q&amp;A · Part 1 recap</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>init_chat_model(&quot;provider:model&quot;)</code></strong> — same call shape for OpenAI, Anthropic, Google, Ollama</li>
<li data-marpit-fragment="2"><strong>Tools</strong> are functions with type hints + docstrings; schemas are generated for you</li>
<li data-marpit-fragment="3"><strong>Memory</strong> = <code>checkpointer</code> + <code>thread_id</code>; <strong>streaming</strong> = <code>values</code> / <code>messages</code> / <code>custom</code></li>
</ul>
<div class="cell" style="margin-top:20px"><h3>Optional exercise</h3><p>Create an agent with <code>create_agent()</code> and a tool that builds a schedule from a <code>task | date</code> table.</p></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="poll-1">Poll</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Which statement best captures the primary advantage of using a framework
like LangChain for LLM-based applications?

  A. It automatically trains your model without any configuration
  B. It offers unified abstractions (agents, models, tools) that
     streamline development
  C. It focuses solely on deployment, not on application logic
  D. It restricts user inputs to enhance security
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" style="--class:lead dark;--theme:automata;"><div class="kicker">Part 2 · notebook 2.0</div>
<h1 id="structured-emoutputsem">Structured <em>outputs</em></h1>
<p>From &quot;nice prose&quot; to data your code can use.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="6" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="why-structured-output">Why structured output?</h2>
<div class="two-col">
<div>
<h3 id="free-text">Free text</h3>
<ul>
<li data-marpit-fragment="1">&quot;Maria seems like a strong candidate, with solid Python...&quot;</li>
<li data-marpit-fragment="2">Can't sort, filter, or store it</li>
<li data-marpit-fragment="3">Parsing prose = regex pain</li>
</ul>
</div>
<div>
<h3 id="structured">Structured</h3>
<ul>
<li data-marpit-fragment="4"><code>evaluation.fit_score</code> → <code>87</code></li>
<li data-marpit-fragment="5"><code>evaluation.recommendation</code> → <code>&quot;hire&quot;</code></li>
<li data-marpit-fragment="6">Type-safe: Pydantic validates every field</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="32" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">response_format + Pydantic</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field
<span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> <span class="hljs-type">List</span>, <span class="hljs-type">Literal</span>

<span class="hljs-keyword">class</span> <span class="hljs-title class_">MovieReview</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):
    <span class="hljs-string">&quot;&quot;&quot;Structured analysis of a movie review.&quot;&quot;&quot;</span>
    title: <span class="hljs-built_in">str</span>
    sentiment: <span class="hljs-type">Literal</span>[<span class="hljs-string">&quot;positive&quot;</span>, <span class="hljs-string">&quot;negative&quot;</span>, <span class="hljs-string">&quot;mixed&quot;</span>]
    rating: <span class="hljs-built_in">int</span> = Field(ge=<span class="hljs-number">1</span>, le=<span class="hljs-number">10</span>)
    key_points: <span class="hljs-type">List</span>[<span class="hljs-built_in">str</span>]
    recommended: <span class="hljs-built_in">bool</span>

agent = create_agent(model=<span class="hljs-string">&quot;openai:gpt-5.6-terra&quot;</span>, response_format=MovieReview)
result = agent.invoke({<span class="hljs-string">&quot;messages&quot;</span>: <span class="hljs-string">&quot;Analyze this review: ...&quot;</span>})
review = result[<span class="hljs-string">&quot;structured_response&quot;</span>]     <span class="hljs-comment"># a validated MovieReview</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-fragments="1" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="two-strategies-under-the-hood">Two strategies under the hood</h2>
<table>
<thead>
<tr>
<th></th>
<th><code>ProviderStrategy</code></th>
<th><code>ToolStrategy</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>How</td>
<td>provider's native structured-output API</td>
<td>tool-calling to extract</td>
</tr>
<tr>
<td>Works with</td>
<td>OpenAI · Anthropic · Gemini</td>
<td>any tool-capable model</td>
</tr>
<tr>
<td>Speed</td>
<td>fastest</td>
<td>one extra hop</td>
</tr>
<tr>
<td>Gotcha</td>
<td>—</td>
<td>needs <code>reasoning_effort=&quot;none&quot;</code></td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1">Pass the schema directly (<code>response_format=MovieReview</code>) and LangChain <strong>auto-picks</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="real-application-resume-analyzer">Real application: resume analyzer</h2>
<ul>
<li data-marpit-fragment="1"><strong>Nested models</strong>: <code>JobFitEvaluation</code> contains a <code>CandidateProfile</code> + a list of <code>SkillAssessment</code></li>
<li data-marpit-fragment="2">Constrained fields: <code>fit_score: int = Field(ge=0, le=100)</code>, <code>recommendation: Literal[&quot;strong_hire&quot;, &quot;hire&quot;, &quot;maybe&quot;, &quot;no_hire&quot;]</code></li>
<li data-marpit-fragment="3"><strong>Batch scoring</strong>: evaluate N resumes, then <code>sorted(evaluations, key=lambda e: e.fit_score)</code> — <em>only possible with structured output</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="lead" data-theme="automata" lang="en-US" class="lead" data-marpit-pagination="35" style="--paginate:true;--class:lead;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Notebook demo</div>

<h1 id="chat-over-documents--emragem">Chat over documents — <em>RAG</em></h1>
<p>Retrieval Augmented Generation with LangChain.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="why-rag">Why RAG?</h2>
<p><img src="assets/rag-docs.png" alt="" style="width:520px;" /></p>
<ul>
<li data-marpit-fragment="1">Connect LLMs to <strong>your</strong> documents — PDFs, HTML, text</li>
<li data-marpit-fragment="2">Context windows are finite; your document base isn't</li>
<li data-marpit-fragment="3">The workaround: <strong>embeddings</strong> + retrieval of just-the-relevant chunks</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="embeddings--meaning-as-geometry">Embeddings — meaning as geometry</h2>
<p><img src="assets/embeddings-scatter.png" alt="" style="width:880px;" /></p>
<ul>
<li>Real 1,536-d vectors from <code>text-embedding-3-small</code>, projected to 2D — distance ≈ meaning</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="1" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="embeddings-power-similarity-search">Embeddings power similarity search</h2>
<p><img src="assets/embeddings-similarity2.png" alt="" style="width:800px;" /></p>
<ul>
<li data-marpit-fragment="1">A <strong>vector store</strong> (Chroma) indexes the vectors so &quot;nearest neighbors&quot; is one query</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="indexing-pipeline">Indexing pipeline</h2>
<div class="flow">
<div class="step"><h3>Load</h3><p>WebBaseLoader</p></div>
<div class="arrow">→</div>
<div class="step"><h3>Split</h3><p>1000 chars, 200 overlap</p></div>
<div class="arrow">→</div>
<div class="step"><h3>Embed</h3><p>text-embedding-3-small</p></div>
<div class="arrow">→</div>
<div class="step"><h3>Store</h3><p>Chroma</p></div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">splits = RecursiveCharacterTextSplitter(chunk_size=<span class="hljs-number">1000</span>, chunk_overlap=<span class="hljs-number">200</span>).split_documents(docs)
vector_store = Chroma.from_documents(documents=splits,
    embedding=OpenAIEmbeddings(model=<span class="hljs-string">&quot;text-embedding-3-small&quot;</span>),
    collection_name=<span class="hljs-string">&quot;rag-tutorial&quot;</span>, persist_directory=<span class="hljs-string">&quot;./chroma-db&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="43" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">A RAG agent — retrieval as a tool</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-meta">@tool(<span class="hljs-params">response_format=<span class="hljs-string">&quot;content_and_artifact&quot;</span></span>)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">retrieve_context</span>(<span class="hljs-params">query: <span class="hljs-built_in">str</span></span>):
    <span class="hljs-string">&quot;&quot;&quot;Retrieve information to help answer a query.&quot;&quot;&quot;</span>
    docs = vector_store.similarity_search(query, k=<span class="hljs-number">2</span>)
    serialized = <span class="hljs-string">&quot;\n\n&quot;</span>.join(
        <span class="hljs-string">f&quot;Source: <span class="hljs-subst">{d.metadata}</span>\nContent: <span class="hljs-subst">{d.page_content}</span>&quot;</span> <span class="hljs-keyword">for</span> d <span class="hljs-keyword">in</span> docs)
    <span class="hljs-keyword">return</span> serialized, docs

agent = create_agent(model, [retrieve_context],
    system_prompt=<span class="hljs-string">&quot;Use the retrieval tool to answer user queries.&quot;</span>)
</code></pre>
<p>The <strong>agent decides</strong> when (and how often) to search.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-marpit-fragments="1" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="rag-agents-vs-rag-chains">RAG agents vs RAG chains</h2>
<table>
<thead>
<tr>
<th></th>
<th>RAG agent — &quot;Agentic RAG&quot;</th>
<th>RAG chain — &quot;2-Step RAG&quot;</th>
</tr>
</thead>
<tbody>
<tr>
<td>Search happens</td>
<td>when the LLM decides</td>
<td>always, before the call</td>
</tr>
<tr>
<td>Multiple searches</td>
<td>yes, with rewritten queries</td>
<td>one</td>
</tr>
<tr>
<td>Latency / cost</td>
<td>≥ 2 model calls</td>
<td>1 model call</td>
</tr>
<tr>
<td>How</td>
<td>retrieval <code>@tool</code></td>
<td><code>@dynamic_prompt</code> middleware</td>
</tr>
<tr>
<td>Best for</td>
<td>complex, multi-hop questions</td>
<td>predictable, speed-critical</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1"><strong>Middleware</strong> is v1's headline extension point — here it injects context and can <strong>return source documents</strong> for citations (<a href="https://docs.langchain.com/oss/python/langchain/middleware">more built-ins</a>: summarization, human-in-the-loop, PII)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="lead" data-theme="automata" lang="en-US" class="lead" data-marpit-pagination="45" style="--paginate:true;--class:lead;--theme:automata;" data-marpit-pagination-total="55"><div class="kicker">Notebook demo</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="qa--part-3-recap">Q&amp;A · Part 3 recap</h2>
<ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="1--langgraph-dev--agent-chat-ui">1 · <code>langgraph dev</code> + Agent Chat UI</h2>
<ul>
<li data-marpit-fragment="1">The <code>demo/</code> app: RAG over two blog posts + Tavily web search — one <code>create_agent()</code> call</li>
<li data-marpit-fragment="2"><code>uv run langgraph dev</code> → starts the <strong>Agent Server</strong> at <code>http://localhost:2024</code>, hot-reloading, <strong>persistence built in</strong></li>
<li data-marpit-fragment="3">Connect <a href="https://agentchat.vercel.app">agentchat.vercel.app</a> → graph ID <code>chat_over_docs</code></li>
<li data-marpit-fragment="4"><code>LANGSMITH_TRACING=true</code> → every run traced in LangSmith (tools, tokens, full history)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="2--a-fully-local-agent--local_agentpy">2 · A fully local agent — <code>local_agent.py</code></h2>
<ul>
<li data-marpit-fragment="1"><code>init_chat_model(&quot;ollama:gemma4&quot;)</code> — <strong>no API key</strong>, same <code>create_agent()</code> API</li>
<li data-marpit-fragment="2">File tools + <code>bash</code>, all <strong>sandboxed</strong>: path-escape guard, command blocklist, 20s timeout</li>
<li data-marpit-fragment="3">Tavily search + a running <code>memory.md</code> log the agent writes after each task</li>
<li data-marpit-fragment="4">One file, <code>uv run</code> — inline script dependencies</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">llm = init_chat_model(<span class="hljs-string">&quot;ollama:gemma4&quot;</span>)
tools = [search, read_file, write_file, edit_file, delete_file, bash]
agent = create_agent(model=llm, tools=tools)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">

<li data-marpit-fragment="3">One-file FastAPI app: agent + <code>/api/chat</code> + embedded UI · full recipe in <code>internal-docs-search-agent/DEPLOYMENT_GUIDE.md</code></li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="55">
<h2 id="final-qa--the-whole-course-on-one-slide">Final Q&amp;A · the whole course on one slide</h2>
